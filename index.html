<!doctype html>
<html lang="ru">

<head>
  <link rel="shortcut icon" href="/favicon/favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>project-vanilla-js</title>
  <link rel="stylesheet" href="./src/scss/style.scss">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header__wrap">
        <div class="logo">
          <a class="logo__link link-reset" href="#">
            <svg class="logo__icon">
              <use href="/img/sprite.svg#logo"></use>
            </svg>
          </a>
        </div>

        <nav class="nav">
          <ul class="menu list-reset">
            <li class="menu__item"><a class="menu__link link-reset" href="#">Главная</a></li>
            <li class="menu__item"><a class="menu__link link-reset" href="#">Каталог</a></li>
            <li class="menu__item"><a class="menu__link link-reset" href="#">Отзывы</a></li>
            <li class="menu__item"><a class="menu__link link-reset" href="#">Контакты</a></li>
          </ul>
        </nav>

        <div class="header__inner">
          <div class="header__messengers">
            <a href="" class="header__messenger-link link-reset">
              <svg class="header__messenger-icon">
                <use href="img/sprite.svg#telegram"></use>
              </svg>
            </a>
            <a href="" class="header__messenger-link link-reset">
              <svg class="header__messenger-icon">
                <use href="img/sprite.svg#whatsapp"></use>
              </svg>
            </a>
          </div>

          <a class="header__link link-reset" href="#">Связаться</a>
        </div>
      </div>

    </div>
  </header>
  <script type="module" src="./src/js/main.js"></script>
</body>

</html>
